[package]
name = "surreal-example"
version = "0.0.1"
authors = ["Andrew Wheeler <genusistimelord@gmail.com>"]
edition = "2021"

[dependencies]
axum = {version = "0.8.9"}
tokio = { version = "1.54.1", features = ["full", "tracing"] }
async-trait = "0.1.92"
surrealdb = { version = "3.3.4", features = ["kv-mem"] }
anyhow = "1.0.104"
serde = "1.0.229"
axum_session_surreal = "0.11.0"

[dependencies.axum_session]
version = "0.23.0"

[dependencies.axum_session_auth]
path = "../../"