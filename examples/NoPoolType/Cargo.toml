[package]
name = "nopool"
version = "0.0.1"
authors = ["Andrew Wheeler <genusistimelord@gmail.com>"]
edition = "2021"

[dependencies]
axum = {version = "0.8.9"}
tokio = { version = "1.54.1", features = ["full", "tracing"] }
async-trait = "0.1.92"
sqlx = { version = "0.9.0", features = [
    "macros",
    "migrate",
    "postgres",
    "sqlite",
    "_unstable-all-types",
    "tls-rustls",
    "runtime-tokio",
] }
anyhow = "1.0.104"
serde = "1.0.229"
axum_session_sqlx = {version = "0.13.0", features = ["sqlite"]}

[dependencies.axum_session]
version = "0.23.1"

[dependencies.axum_session_auth]
path = "../../"